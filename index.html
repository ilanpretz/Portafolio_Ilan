<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Portafolio · Ilán Pretz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">    <link href="styles.css" rel="stylesheet">
</head>
<style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#5a5a5a;color:#fff;font-family:Arial,sans-serif;min-width:0}
    a{color:inherit;text-decoration:none}
    .pagina{position:relative;width:1264px;height:807px;margin:0 auto;overflow:hidden}\n    .pagina::after{content:"";position:absolute;right:0;bottom:0;left:0;height:58px;background:#7891a7}
    .barra,.titulo{height:85px;background:#ffbf3f}
    .barra{display:flex;align-items:center;justify-content:space-between;padding:0 70px}
    .marca{font-size:48px;font-weight:700}
    .nav{display:flex;gap:28px;font-size:26px;font-weight:700}
    .hero{height:722px;display:flex;align-items:center}
    .hero-text{width:50%;padding-left:82px}
    .hero-text h1,.bloque h2,.bloque h3,.recientes{color:#ffbf3f}
    .hero-text h1{font-size:48px;margin:0 0 32px 84px}
    .hero-text h2{color:#ffbf3f;font-size:30px;line-height:1.25;margin:0 0 42px}
    .hero-text p{font-size:18px;line-height:1.2;width:420px;margin:0}
    .hero-img{width:640px;height:480px;object-fit:cover;filter:grayscale(1)}
    .titulo{display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}
    .experiencia{height:722px;display:flex;align-items:center;padding:0 47px;gap:48px}
    .galeria{width:653px;display:grid;grid-template-columns:426px 208px;grid-template-rows:284px 284px;gap:49px 18px}
    .galeria img{width:100%;height:100%;object-fit:cover}
    .etiquetas{display:grid;gap:8px}
    .etiquetas img{height:200px}
    .bloque{width:470px}
    .bloque h2{font-size:46px;line-height:1.2;margin:0 0 66px}
    .bloque h3{font-size:32px;margin:0 0 12px}
    .bloque p{font-size:18px;line-height:1.25;margin:0 0 36px}
    .foto{height:722px;padding-top:75px}
    .recientes{text-align:center;font-size:48px;margin:0 0 54px}
    .carrusel{width:965px;height:452px;margin:auto;padding:30px 135px;background:#ffbf3f}
    .carrusel .carousel-item{height:392px}
    .carrusel img{width:690px;height:392px;object-fit:cover;margin:auto}
    .contacto{height:722px;padding-top:82px}
    .contacto h2{text-align:center;color:#ffbf3f;font-size:48px;margin:0 0 50px}
    .formulario{width:560px;margin:auto}
    .formulario .form-label{font-size:18px}
    .formulario .form-control{margin-bottom:18px}
    .formulario .btn{background:#ffbf3f;border-color:#ffbf3f;color:#fff}
   footer{height:86px;background:#7891a7;display:flex;align-items:center;justify-content:center;font-size:27px}
  </style>
<body>

    <header class="barra">
      <a class="marca" href="#inicio">Mi Portafolio</a>
      <nav class="nav">
  <a href="experiencia.html">Experiencia</a>
  <a href="fotografia.html">Fotografía de Producto</a>
  <a href="contacto.html">Contacto</a>
</nav>
</header>
<main class="pagina" id="Mi Portafolio">

    <div class="hero">
      <div class="hero-text">
        <h1>Ilán Pretz</h1>
        <h2>Capturando la esencia visual<br>del diseño y el producto.</h2>
        <p>Diseñador y fotógrafo especializado en imagen de marca, comunicación visual y conceptualización estética.</p>
      </div>
      <img class="hero-img" src="img/foto-perfil.jpg" alt="Ilán Pretz">
      </div>
    </div>
  </section>
</main>
<footer>2026 · Mi Portfolio</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
